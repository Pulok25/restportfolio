<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="brand" id="brand">Portfolio</a>
      <div class="nav-links">
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#certificates">Certificates</a>
        <button id="editToggle" type="button" class="toggle">Edit mode: OFF</button>
      </div>
    </div>
  </nav>

  <div id="banner" class="banner" hidden></div>

  <header class="hero" id="top">
    <div class="wrap">
      <p class="eyebrow" id="bioLocation"></p>
      <h1 id="bioName">Loading...</h1>
      <p class="headline" id="bioHeadline"></p>
      <p class="about" id="bioAbout"></p>
      <div class="links" id="bioLinks"></div>
      <div class="admin-only"><button type="button" id="editBio">Edit bio</button></div>
    </div>
  </header>

  <main class="wrap">
    <section id="projects">
      <div class="section-head">
        <h2>Projects</h2>
        <button type="button" class="primary admin-only" data-add="projects">+ Add project</button>
      </div>
      <div id="projectsList" class="grid"></div>
    </section>

    <section id="skills">
      <div class="section-head">
        <h2>Skills</h2>
        <button type="button" class="primary admin-only" data-add="skills">+ Add skill</button>
      </div>
      <div id="skillsList" class="skills"></div>
    </section>

    <section id="experience">
      <div class="section-head">
        <h2>Experience</h2>
        <button type="button" class="primary admin-only" data-add="experience">+ Add experience</button>
      </div>
      <div id="experienceList" class="timeline"></div>
    </section>

    <section id="certificates">
      <div class="section-head">
        <h2>Certificates</h2>
        <button type="button" class="primary admin-only" data-add="certificates">+ Add certificate</button>
      </div>
      <div id="certificatesList" class="grid"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <span>Data loaded live from a REST API and a database.</span>
  </footer>

  <dialog id="dlg">
    <form id="form">
      <h3 id="formTitle"></h3>
      <div id="fields"></div>
      <p class="form-error" id="formError"></p>
      <div class="row">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
